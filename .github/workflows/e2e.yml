name: Playwright E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  E2E_ALLOW_DATABASE_WRITES: "true"
  DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
  DIRECT_URL: ${{ secrets.E2E_DIRECT_URL }}
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
  NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
  APP_URL: http://127.0.0.1:3000
  EMAIL_ENABLED: "false"
  EMAIL_PROVIDER: noop
  AI_REPORT_ENABLED: "true"
  AI_PROVIDER: mock

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require disposable E2E environment
        run: npx tsx -e "import { assertE2EDatabaseWritesAllowed } from './tests/fixtures/e2e-environment'; assertE2EDatabaseWritesAllowed();"
      - run: npm run test:e2e:smoke
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  transaction-permission:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require disposable E2E environment
        run: npx tsx -e "import { assertE2EDatabaseWritesAllowed } from './tests/fixtures/e2e-environment'; assertE2EDatabaseWritesAllowed();"
      - run: npm run test:e2e:transactions
      - run: npm run test:e2e:permissions
      - run: npx playwright test tests/security/e2e-leak-audit.spec.ts --workers=1
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-transaction-permission-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Require disposable E2E environment
        run: npx tsx -e "import { assertE2EDatabaseWritesAllowed } from './tests/fixtures/e2e-environment'; assertE2EDatabaseWritesAllowed();"
      - run: npm run test:e2e -- --workers=1
      - run: npm run test:e2e:performance
      - run: npx playwright test tests/security/e2e-leak-audit.spec.ts --workers=1
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-nightly-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
